name: ebpf-experiments

# Experiment matrix for the fanotify/eBPF capture optimizations. Each cell
# does a COLD Hugo build+SBOM under trace:ebpf and records timing + the
# fanotify/eBPF diagnostics, so we can measure on the REAL Azure runner what
# the local colima VM already showed:
#
#   - ignore-once (FAN_MARK_IGNORE per inode, "hash each inode once") is now
#     DEFAULT ON. The `ignore_off` cell disables it for the A/B delta.
#   - unlimited-queue (FAN_UNLIMITED_QUEUE) was a no-op locally (0 overflows
#     at 4 vCPU); this is where we find out if the heavier Hugo build on a
#     hosted runner actually overflows the 16384-event queue.
#   - ringbuf-resize: the compiled-in ringbufs are 256MiB + 1GiB; the
#     `ringbuf_small` cell shrinks them to prove the knob + check drops.
#   - strict_zero_drops: does ignore-once let --require-zero-drops pass here?
#
# A Phase-0 probe step records the runtime kernel facts the research left
# unverified (kernel version, active LSM list, IMA, FS type, caps).

on:
  workflow_dispatch:
  push:
    branches: [ebpf-experiments]

permissions:
  contents: read

env:
  CILOCK_URL: https://github.com/colek42/hugo/releases/download/cilock-demo/cilock-linux-amd64
  CILOCK_SHA256: dc1df016d29bbbcd247d62ac6ec345dffb5d16ea7303dbe45b53f665c0ef88fd

jobs:
  experiment:
    name: ${{ matrix.cell.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell:
          # Read-tap ablation (ignore-once default-on in both). Tests whether
          # the eBPF read-tap is net-negative: local runs showed it adds ~93%
          # cache/temp NOISE to materials + non-determinism + partial-read
          # fallbacks + the 1GiB ring, for ~27 legit GOROOT mmap reads.
          # readtap: ""=on (default), "off"=disabled.
          - { name: readtap_on,  readtap: "" }
          - { name: readtap_off, readtap: "off" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: false }

      # Phase 0 — record the runtime kernel reality the research couldn't
      # confirm without a live runner. Cheap, always runs.
      - name: 'Probe: runner kernel reality'
        if: always()
        run: |
          echo "## probe (${{ matrix.cell.name }})" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "uname: $(uname -r)"
            echo "lsm: $(cat /sys/kernel/security/lsm 2>&1)"
            echo "ima dir: $(ls /sys/kernel/security/ima/ 2>&1 | tr '\n' ' ')"
            echo "btf: $(ls -l /sys/kernel/btf/vmlinux 2>&1 | awk '{print $5}')"
            echo "workspace fs: $(df -T . | tail -1)"
            echo "nproc: $(nproc)  mem: $(free -h | awk '/Mem:/{print $2}')"
            echo "caps: $(grep CapEff /proc/self/status 2>&1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install cilock (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o cilock "$CILOCK_URL"
          echo "${CILOCK_SHA256}  cilock" | sha256sum -c -
          chmod +x cilock && sudo mv cilock /usr/local/bin/cilock && cilock version

      - name: Install tools (syft + eBPF toolchain)
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev linux-tools-common linux-tools-generic
          REAL_BPFTOOL="$(find /usr/lib/linux-tools-* -maxdepth 1 -name bpftool -type f 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "${REAL_BPFTOOL:-}" ] && { sudo ln -sf "$REAL_BPFTOOL" /usr/local/sbin/bpftool; sudo ln -sf "$REAL_BPFTOOL" /usr/sbin/bpftool; } || true

      - name: Provision key
        run: |
          install -m 600 /dev/null cilock.key
          printf '%s' "${{ secrets.CILOCK_SIGNING_KEY }}" > cilock.key

      - name: 'Experiment: cold build under trace:ebpf'
        id: run
        run: |
          set -uo pipefail
          ENVV=( "PATH=$PATH" "HOME=$HOME" )
          [ -n "${{ matrix.cell.readtap }}" ] && ENVV+=( "CILOCK_EBPF_READTAP=${{ matrix.cell.readtap }}" )
          START=$(date +%s.%N)
          sudo env "${ENVV[@]}" \
            cilock run --step build --workload manual \
              --trace --capture-mode trace:ebpf --hardening standard \
              -a environment,git,go-build,slsa,sbom -k cilock.key -o build.att.json \
              -- bash -c 'go build -trimpath -ldflags=-buildid= -o hugo-bin . && syft scan hugo-bin -o cyclonedx-json=hugo-bin.cdx.json -q'
          RC=$?
          END=$(date +%s.%N)
          echo "cilock_exit=$RC" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$(awk "BEGIN{printf \"%.1f\", $END-$START}")" >> "$GITHUB_OUTPUT"
          sudo chown -R "$(id -un):$(id -gn)" . || true

      - name: Analyze
        if: always()
        run: |
          python3 - <<'PY'
          import json, base64, os
          cell = "${{ matrix.cell.name }}"
          res = {"cell": cell,
                 "cilock_exit": "${{ steps.run.outputs.cilock_exit }}",
                 "wall_seconds": "${{ steps.run.outputs.wall_seconds }}"}
          keys = ["fanotifyEventsHashed","fanotifyCacheSkips","fanotifyIgnoreMarksAdded",
                  "fanotifyIgnoreMarkErrors","fanotifyTimeouts","fanotifyQueueOverflows",
                  "ringbufOpenatDrops","ringbufReadTapDrops","hashFailureSilentDrops",
                  "partialReadFallbacks","fallbackHashFailures","cacheReadsSkipped","bytesHashed"]
          try:
              d = json.load(open("build.att.json")); p = json.loads(base64.b64decode(d["payload"]))
              ats = {a["type"]: a["attestation"] for a in p["predicate"]["attestations"]}
              pr = ats.get("https://aflock.ai/attestations/product/v0.3", {})
              res["product_treeSize"] = pr.get("treeSize")
              res["material_treeSize"] = ats.get("https://aflock.ai/attestations/material/v0.3", {}).get("treeSize")
              diag = ats.get("https://aflock.ai/attestations/command-run/v0.1", {}).get("summary", {}).get("diagnostics", {})
              res["diagnostics"] = {k: diag.get(k, 0) for k in keys}
          except Exception as e:
              res["att_error"] = str(e)
          # Categorize the material leaves so we can see whether the read-tap
          # is adding legit inputs or cache/temp NOISE.
          try:
              t = json.load(open("build.att.material.tree.json"))
              import collections
              cat = collections.Counter()
              for lf in t.get("leaves", []):
                  x = lf.get("path","")
                  if "/pkg/mod/" in x or "/go-build" in x or "/.cache/" in x: cat["gocache_modcache"] += 1
                  elif x.startswith("/tmp/"): cat["tmp"] += 1
                  elif x.startswith("/proc/") or x.startswith("/sys/"): cat["procsys"] += 1
                  elif "/go/" in x or x.endswith(".go") or "/pkg/include/" in x: cat["goroot_src"] += 1
                  else: cat["other"] += 1
              res["material_categories"] = dict(cat)
          except Exception as e:
              res["material_cat_error"] = str(e)
          json.dump(res, open(f"result-{cell}.json","w"), indent=2)
          print(json.dumps(res, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"## {cell}\n```\n{json.dumps(res, indent=2)}\n```\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.cell.name }}
          path: result-${{ matrix.cell.name }}.json
          if-no-files-found: warn
